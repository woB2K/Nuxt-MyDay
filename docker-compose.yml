name: myday

x-database-url: &database-url postgresql://${POSTGRES_USER:-myday}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-myday}?schema=public

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-myday}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      NUXT_JWT_ACCESS_SECRET: ${NUXT_JWT_ACCESS_SECRET:?set NUXT_JWT_ACCESS_SECRET in .env}
      NUXT_JWT_REFRESH_SECRET: ${NUXT_JWT_REFRESH_SECRET:?set NUXT_JWT_REFRESH_SECRET in .env}
      NUXT_GOOGLE_CLIENT_ID: ${NUXT_GOOGLE_CLIENT_ID:-}
      NUXT_GOOGLE_CLIENT_SECRET: ${NUXT_GOOGLE_CLIENT_SECRET:-}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:?set NUXT_PUBLIC_APP_URL in .env}
    ports:
      - ${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
