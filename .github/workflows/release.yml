name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to (re)publish images for, e.g. 2.3.0
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NUXT_TELEMETRY_DISABLED: 1

jobs:
  release:
    name: tag and release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.publish.outputs.version }}
      released: ${{ steps.publish.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag and publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged, nothing to release"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm -s release:notes "$version" > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "$(pnpm -s release:title "$version")" --notes-file notes.md
          echo "released=true" >> "$GITHUB_OUTPUT"

  images:
    name: images (${{ matrix.image }})
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.released == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: myday
            target: runtime
          - image: myday-migrate
            target: migrate

    steps:
      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.version || needs.release.outputs.version }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.version.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Check the image is public
        env:
          IMAGE: ${{ steps.version.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$IMAGE:pull" | jq -r '.token // empty') || token=
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/$IMAGE/manifests/$VERSION"; then
            echo "::warning title=ghcr.io/$IMAGE is private::Self-hosters cannot pull it. Make it public once: Package settings → Change visibility → Public"
          fi
