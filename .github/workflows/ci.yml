name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://ci:ci@localhost:5432/myday_ci?schema=public

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  quality:
    name: lint · typecheck · unit · build
    if: always()
    needs: [lint, typecheck, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  changelog:
    name: changelog
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm release:check

  integration:
    name: integration api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/myday_test?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myday_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myday_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Prepare test env
        run: cp .env.test.example .env.test
      - name: Integration tests
        run: pnpm test:integration

  docker:
    name: docker images
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for amd64 and arm64
        run: |
          for platform in amd64 arm64; do
            docker buildx build --platform "linux/$platform" --target runtime --load -t "myday:$platform" .
            docker buildx build --platform "linux/$platform" --target migrate --load -t "myday-migrate:$platform" .
          done
      - name: Native bcrypt loads on both architectures
        run: |
          for platform in amd64 arm64; do
            docker run --rm --platform "linux/$platform" "myday:$platform" \
              node -e "require('/app/.output/server/node_modules/bcrypt').hash('x', 4).then(h => console.log('$platform', h.slice(0, 7)))"
          done
      - name: Admin CLI runs in the migrate image
        run: |
          for platform in amd64 arm64; do
            docker run --rm --platform "linux/$platform" -e DATABASE_URL=postgresql://x:x@localhost:5432/x "myday-migrate:$platform" pnpm -s admin
          done

  e2e:
    name: e2e
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/myday_test?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myday_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myday_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Prepare test env
        run: cp .env.test.example .env.test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
