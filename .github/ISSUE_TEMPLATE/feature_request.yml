name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you or your family try to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you'd like it to work. Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it now
      description: Another app, a spreadsheet, a workaround.
