<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyDay — Auth Screens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #07070A; color: #F4F4F7; height: 100%; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="tokens.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="auth-screens.jsx"></script>
</head>
<body>
  <div id="app"></div>
  <script type="text/babel">
    function App() {
      React.useEffect(() => { window.applyTokens && window.applyTokens('#A78BFA'); }, []);
      return (
        <window.DesignCanvas>
          <window.DCSection id="auth" title="MyDay — Auth Flow" subtitle="Welcome → Sign In → Create Account · 390 × 844 · dark theme">
            <window.DCArtboard id="welcome" label="01 Welcome" width={406} height={920} style={{ background: 'transparent', border: 'none', boxShadow: 'none' }}>
              <window.PhoneShell><window.WelcomeScreen /></window.PhoneShell>
            </window.DCArtboard>
            <window.DCArtboard id="signin" label="02 Sign In" width={406} height={920} style={{ background: 'transparent', border: 'none', boxShadow: 'none' }}>
              <window.PhoneShell><window.SignInScreen /></window.PhoneShell>
            </window.DCArtboard>
            <window.DCArtboard id="signup" label="03 Create Account" width={406} height={920} style={{ background: 'transparent', border: 'none', boxShadow: 'none' }}>
              <window.PhoneShell><window.CreateAccountScreen /></window.PhoneShell>
            </window.DCArtboard>
          </window.DCSection>
        </window.DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
